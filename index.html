<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恢复—节律系统 V3.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-deep: #060814;
            --bg-mid: #0a0e1f;
            --bg-card: rgba(20, 26, 50, 0.55);
            --accent-1: #7c5cff; /* 紫 */
            --accent-2: #4ad6ff; /* 青 */
            --accent-3: #b388ff; /* 浅紫 */
            --text-1: #e8ecff;
            --text-2: #9aa3c7;
            --text-3: #5c6489;
            --border: rgba(124, 92, 255, 0.25);
            --glow: 0 0 40px rgba(124, 92, 255, 0.35);
        }
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            color: var(--text-1);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-weight: 300;
            line-height: 1.7;
            letter-spacing: 0.02em;
            -webkit-font-smoothing: antialiased;
        }
        /* 背景星空粒子 */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        /* 背景光晕 */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .aurora::before, .aurora::after {
            content: '';
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .aurora::before {
            background: radial-gradient(circle, var(--accent-1), transparent 60%);
            top: -20%;
            left: -10%;
        }
        .aurora::after {
            background: radial-gradient(circle, var(--accent-2), transparent 60%);
            bottom: -25%;
            right: -15%;
            animation-delay: -9s;
        }
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(8vw, -6vw) scale(1.15); }
        }
        /* 顶部进度条 */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 14px 20px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to bottom, rgba(6,8,20,0.85), transparent);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .brand {
            font-size: 11px;
            letter-spacing: 0.3em;
            color: var(--text-3);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .progress-track {
            flex: 1;
            height: 2px;
            background: rgba(124, 92, 255, 0.12);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 0 12px var(--accent-1);
            transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .page-num {
            font-size: 11px;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.1em;
        }
        /* 页面容器 */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .page {
            position: absolute;
            inset: 0;
            padding: 70px 24px 110px;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .page::-webkit-scrollbar {
            display: none;
        }
        .page.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .page.prev {
            transform: translateY(-20px);
        }
        /* 页面内容包装 */
        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }
